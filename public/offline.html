<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#002169" />
  <title>Sin conexión — VistaSatPRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', Helvetica, Arial, sans-serif;
      background-color: #002169;
      color: #FFFFFF;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    /* Logo área */
    .logo-area {
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      background-color: rgba(255,255,255,0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .logo-icon svg {
      width: 44px;
      height: 44px;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .app-name span {
      color: #CF095E;
    }

    /* Offline icon */
    .offline-icon {
      width: 96px;
      height: 96px;
      background-color: rgba(207, 9, 94, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      border: 2px solid rgba(207, 9, 94, 0.3);
    }

    .offline-icon svg {
      width: 48px;
      height: 48px;
      color: #CF095E;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255,255,255,0.75);
      max-width: 320px;
      margin: 0 auto 40px;
    }

    /* Retry button */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: #CF095E;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 0;
      padding: 16px 32px;
      cursor: pointer;
      transition: opacity 0.2s;
      min-height: 52px;
    }

    .btn-retry:hover { opacity: 0.85; }
    .btn-retry:active { opacity: 0.7; }

    /* Info de caché */
    .cached-info {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.15);
      width: 100%;
      max-width: 360px;
    }

    .cached-info h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 16px;
    }

    .tip {
      background-color: rgba(255,255,255,0.08);
      border-left: 3px solid #CF095E;
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="logo-area">
    <div class="logo-icon">
      <!-- Icono maletín técnico SVG -->
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="16" width="32" height="22" rx="3" stroke="#FFFFFF" stroke-width="2.5"/>
        <path d="M15 16V13C15 11.3 16.3 10 18 10H26C27.7 10 29 11.3 29 13V16" stroke="#CF095E" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="26" x2="38" y2="26" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5"/>
        <circle cx="22" cy="26" r="3" fill="#CF095E"/>
      </svg>
    </div>
    <div class="app-name">Vista<span>Sat</span>PRO</div>
  </div>

  <div class="offline-icon">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6L42 42"/>
      <path d="M24 36h.01"/>
      <path d="M15.4 15.4A14 14 0 0 0 10 24"/>
      <path d="M20.1 10.5A20 20 0 0 1 38 24"/>
      <path d="M28.3 28.3A14 14 0 0 1 24 29c-3.9 0-7.4-1.6-10-4.1"/>
    </svg>
  </div>

  <h1>Sin conexión</h1>
  <p>No hay conexión a Internet en este momento. Comprueba tu señal y vuelve a intentarlo.</p>

  <button class="btn-retry" onclick="window.location.reload()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
      <path d="M21 3v5h-5"/>
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
      <path d="M8 16H3v5"/>
    </svg>
    Reintentar conexión
  </button>

  <div class="cached-info">
    <h2>💡 Mientras tanto</h2>
    <div class="tip">
      Las tareas que ya has visitado siguen disponibles en caché. Navega hacia atrás para verlas sin conexión.
    </div>
  </div>

</body>
</html>
